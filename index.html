<h1>rclone-aletheia</h1>
<p>Personal OAuth client used by a single individual to let the open-source tool
<a href="https://rclone.org">rclone</a> store client-side-encrypted backups
(via <a href="https://restic.net">restic</a>) in the developer's own Google Drive.</p>
<p>The app is not offered to other users and has no public service.</p>
<p><a href="privacy.html">Privacy Policy</a></p>
